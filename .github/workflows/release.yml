name: Publication de l'application de bureau

# Une version est publiée en poussant un tag : v1.0.0, v1.0.1…
# Le workflow compile l'application, signe le paquet, publie la release
# (avec le manifeste de mise à jour) : l'application installée la
# automatiquement au démarrage suivant.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex : 1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Compiler, signer et publier
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Installer les dépendances du site
        # La configuration Tailwind du site est reprise par l'application de
        # bureau : elle a besoin des dépendances du site (tailwindcss,
        # daisyui…).
        run: npm ci

      - name: Installer les dépendances de l'application
        working-directory: desktop
        run: npm ci

      - name: Vérifier les types de l'application
        working-directory: desktop
        # Le bureau compile le code du site : une erreur de type dans le site
        # ne doit pas empêcher de publier l'application. L'étape est donc
        # indicative (elle s'affiche dans le journal).
        continue-on-error: true
        run: npm run typecheck

      - name: Préparer les images et les polices
        working-directory: desktop
        run: |
          node scripts/copy-assets.mjs
          node scripts/fetch-fonts.mjs

      - name: Aligner la version sur le tag
        working-directory: desktop
        run: node scripts/set-version.mjs "${{ github.event.inputs.version || github.ref_name }}"

      - name: Compiler, signer et préparer la mise à jour
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release.mjs --notes "Version ${{ github.event.inputs.version || github.ref_name }}"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            desktop/release/latest.json
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
